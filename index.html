<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Progreso">
<meta name="description" content="Seguimiento de pilares, objetivos y tareas diarias con rachas y trofeos.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Progreso</title>
<style>
:root{
  --bg:#0b0d12;--s1:#14171f;--s2:#1b1f2a;--s3:#252a37;--line:#2a3040;
  --tx:#eef1f6;--mu:#8b93a7;--mu2:#5d6477;
  --ac:#ff7a1a;--ac2:#ffb03a;--ok:#3ddc97;--danger:#ff5a5f;
  --r:20px;--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx)}
body{font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;min-height:100dvh;overscroll-behavior-y:none;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
#app{max-width:560px;margin:0 auto;padding:calc(var(--st) + 18px) 16px calc(var(--sb) + 104px)}
h1,h2,h3{margin:0;line-height:1.15}
h1{font-size:30px;letter-spacing:-.02em;font-weight:750}
.eyebrow{color:var(--mu);font-size:13px;letter-spacing:.01em}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px}
.muted{color:var(--mu)}
.card{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.sec-h{display:flex;align-items:center;justify-content:space-between;margin:26px 2px 10px}
.sec-h h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--mu);font-weight:650}
.link{color:var(--ac2);font-size:14px;font-weight:600;padding:6px 2px}

/* Hero */
.hero{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;padding:18px;background:
  radial-gradient(120% 140% at 100% 0%,rgba(255,122,26,.16),transparent 55%),var(--s1)}
.ring{position:relative;width:92px;height:92px}
.ring svg{transform:rotate(-90deg)}
.ring .lbl{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1}
.ring .lbl b{font-size:22px;font-weight:750}
.ring .lbl small{display:block;font-size:11px;color:var(--mu);margin-top:3px}
.ring circle{fill:none;stroke-width:9}
.ring .bgc{stroke:var(--s3)}
.ring .fgc{stroke:url(#gfire);stroke-linecap:round;transition:stroke-dashoffset .5s cubic-bezier(.2,.8,.2,1)}
.streak-n{display:flex;align-items:baseline;gap:6px}
.streak-n b{font-size:40px;font-weight:800;letter-spacing:-.03em;line-height:1}
.streak-n span{color:var(--mu);font-size:15px}
.flame{font-size:26px;filter:drop-shadow(0 2px 10px rgba(255,122,26,.5))}
.flame.off{filter:grayscale(1) opacity(.45)}
.hero .best{font-size:13px;color:var(--mu);margin-top:4px}
.next{margin-top:12px;font-size:13px;color:var(--mu)}
.bar{height:7px;border-radius:9px;background:var(--s3);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--ac),var(--ac2));transition:width .5s}
.hint{margin-top:12px;padding:11px 14px;border-radius:14px;font-size:14px;background:var(--s2);color:var(--mu)}
.hint.win{background:linear-gradient(90deg,rgba(255,122,26,.18),rgba(255,176,58,.08));color:var(--tx);border:1px solid rgba(255,122,26,.35)}

/* Week strip */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:14px}
.wd{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;color:var(--mu)}
.wd i{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--s2);font-style:normal;font-size:14px;border:1.5px solid transparent}
.wd.full i{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#1a0d00}
.wd.part i{background:rgba(255,122,26,.16);border-color:rgba(255,122,26,.35)}
.wd.today{color:var(--tx);font-weight:650}
.wd.today i{border-color:var(--tx)}

/* Tasks */
.group{margin-bottom:14px}
.ghead{display:flex;align-items:center;gap:8px;margin:0 4px 8px;font-size:14px;font-weight:650}
.ghead .dot{width:8px;height:8px;border-radius:50%;background:var(--c)}
.ghead small{margin-left:auto;color:var(--mu);font-weight:500}
.task{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:15px 16px;background:var(--s1);border:1px solid var(--line);border-radius:16px;margin-bottom:8px;min-height:56px;transition:background .2s,border-color .2s}
.task:active{transform:scale(.985)}
.check{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--c);display:grid;place-items:center;transition:background .2s}
.check svg{width:14px;height:14px;opacity:0;transform:scale(.4);transition:.2s}
.task.done{background:color-mix(in srgb,var(--c) 10%,var(--s1));border-color:color-mix(in srgb,var(--c) 35%,var(--line))}
.task.done .check{background:var(--c)}
.task.done .check svg{opacity:1;transform:none}
.task.done .tt{color:var(--mu);text-decoration:line-through;text-decoration-color:var(--mu2)}
.task.just .check{animation:pop .4s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.6)}100%{transform:scale(1)}}

.empty{text-align:center;padding:32px 20px;border:1.5px dashed var(--line);border-radius:var(--r);color:var(--mu)}
.empty .big{font-size:40px;margin-bottom:8px}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 20px;border-radius:15px;font-weight:650;font-size:16px}
.btn.primary{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#1a0d00}
.btn.soft{background:var(--s2);border:1px solid var(--line)}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.danger{color:var(--danger)}
.btn.block{width:100%}
.row-btns{display:flex;gap:10px;margin-top:20px}
.row-btns .btn{flex:1}

/* Pillars */
.pcard{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);margin-bottom:16px;overflow:hidden}
.pcard>header{display:flex;align-items:center;gap:12px;padding:16px;background:linear-gradient(135deg,color-mix(in srgb,var(--c) 22%,transparent),transparent 70%)}
.pcard .pe{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:24px;background:color-mix(in srgb,var(--c) 22%,var(--s2))}
.pcard h2{font-size:20px;font-weight:720}
.pcard header small{display:block;color:var(--mu);font-size:13px;margin-top:2px}
.pbody{padding:4px 16px 16px}
.sub{display:flex;align-items:center;justify-content:space-between;margin:14px 0 8px}
.sub h3{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--mu);font-weight:650}
.sub button{color:var(--c);font-weight:650;font-size:14px;padding:6px 0 6px 10px}
.item{display:block;width:100%;text-align:left;padding:12px 14px;border-radius:14px;background:var(--s2);margin-bottom:8px}
.item .row{display:flex;align-items:center;gap:10px}
.item .row b{font-weight:600;flex:1;min-width:0;overflow-wrap:anywhere}
.item .pct{font-size:13px;color:var(--mu);font-variant-numeric:tabular-nums}
.item .meta{font-size:12px;color:var(--mu);margin-top:6px}
.item .bar i{background:var(--c)}
.item.done b{color:var(--mu)}
.item.done .pct{color:var(--c)}
.none{font-size:14px;color:var(--mu2);padding:4px 2px 6px}
.tdot{width:6px;height:6px;border-radius:50%;background:var(--c);flex:none}

/* Achievements */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:14px 12px}
.stat b{display:block;font-size:26px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--mu)}
.heat{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;gap:4px}
.heat i{aspect-ratio:1;border-radius:4px;background:var(--s2)}
.heat i.p{background:rgba(255,122,26,.3)}
.heat i.f{background:linear-gradient(135deg,var(--ac),var(--ac2))}
.heat i.x{background:transparent}
.heat i.t{outline:1.5px solid var(--tx);outline-offset:-1.5px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--mu);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.trophies{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.trophy{background:var(--s1);border:1px solid var(--line);border-radius:18px;padding:14px 8px 12px;text-align:center}
.medal{width:62px;height:62px;margin:0 auto 8px;border-radius:50%;display:grid;place-items:center;font-size:28px;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.55),transparent 45%),var(--tier);box-shadow:0 0 0 4px color-mix(in srgb,var(--tier) 30%,transparent),0 8px 24px color-mix(in srgb,var(--tier) 30%,transparent)}
.trophy b{display:block;font-size:13px;line-height:1.2}
.trophy small{display:block;font-size:12px;color:var(--mu);margin-top:3px}
.trophy.lock .medal{background:var(--s3);box-shadow:none;filter:grayscale(1);opacity:.4}
.trophy.lock b{color:var(--mu)}
.tier-bronze{--tier:#cd7f32}.tier-silver{--tier:#c3cad6}.tier-gold{--tier:#ffc83d}.tier-platinum{--tier:#7fdcf5}.tier-diamond{--tier:#b98bff}
.logro{display:flex;align-items:center;gap:14px;padding:12px 14px;background:var(--s1);border:1px solid var(--line);border-radius:16px;margin-bottom:8px}
.logro .le{width:44px;height:44px;flex:none;border-radius:14px;display:grid;place-items:center;font-size:22px;background:rgba(255,122,26,.14)}
.logro.lock .le{filter:grayscale(1);opacity:.4;background:var(--s2)}
.logro b{display:block;font-size:15px}
.logro small{display:block;color:var(--mu);font-size:13px}
.logro .when{margin-left:auto;font-size:12px;color:var(--ac2);white-space:nowrap}

/* Forms */
.fld{display:block;margin-bottom:16px}
.fld>span{display:block;font-size:13px;color:var(--mu);margin-bottom:7px;font-weight:550}
.fld input[type=text],.fld input:not([type]),.fld input[type=date]{width:100%;min-height:50px;padding:0 14px;border-radius:14px;border:1px solid var(--line);background:var(--s2);outline:none;font-size:16px}
.fld input:focus{border-color:var(--ac)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip input,.sw input{position:absolute;opacity:0;pointer-events:none}
.chip span{display:inline-flex;align-items:center;gap:6px;min-height:42px;padding:0 14px;border-radius:12px;background:var(--s2);border:1.5px solid var(--line);font-size:15px}
.chip input:checked+span{border-color:var(--c);background:color-mix(in srgb,var(--c) 18%,var(--s2))}
.chip input:focus-visible+span,.sw input:focus-visible+span{outline:2px solid var(--tx);outline-offset:2px}
input[type=range]{width:100%;accent-color:var(--ac);height:32px}
.range-h{display:flex;justify-content:space-between;align-items:baseline}
.range-h output{font-weight:750;font-size:20px;color:var(--tx);font-variant-numeric:tabular-nums}

.pedit{display:grid;grid-template-columns:56px 1fr;gap:10px;padding:14px;border-radius:18px;background:var(--s1);border:1px solid var(--line);margin-bottom:12px;border-left:4px solid var(--c)}
.pedit .emoji{width:56px;height:50px;text-align:center;font-size:24px;border-radius:14px;border:1px solid var(--line);background:var(--s2);outline:none}
.pedit .pname{min-height:50px;padding:0 14px;border-radius:14px;border:1px solid var(--line);background:var(--s2);outline:none;font-size:17px;font-weight:600;min-width:0}
.pedit input:focus{border-color:var(--c)}
.swatches{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}
.sw{position:relative}
.sw span{display:block;width:30px;height:30px;border-radius:50%;background:var(--sw);border:3px solid var(--s1);box-shadow:0 0 0 1.5px transparent}
.sw input:checked+span{box-shadow:0 0 0 2px var(--tx)}

.onb{min-height:calc(100dvh - 140px);display:flex;flex-direction:column;justify-content:center}
.onb .logo{font-size:54px;margin-bottom:10px}
.onb p{color:var(--mu);margin:10px 0 24px}

.setting{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:15px 16px;background:var(--s1);border:1px solid var(--line);border-radius:16px;margin-bottom:8px}
.setting .ic{font-size:20px;width:28px;text-align:center}
.setting b{display:block;font-weight:600}
.setting small{display:block;font-size:13px;color:var(--mu)}
.setting.danger b{color:var(--danger)}
.note{font-size:13px;color:var(--mu);padding:4px 4px 0}

/* Nav */
#nav{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:8px 10px calc(var(--sb) + 8px);background:rgba(11,13,18,.82);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border-top:1px solid var(--line)}
#nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
#nav button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:11px;color:var(--mu2);font-weight:600;min-height:50px}
#nav svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#nav button.on{color:var(--tx)}
#nav button.on svg{stroke:var(--ac)}
#nav[hidden]{display:none}

/* Sheet */
#sheet-root{position:fixed;inset:0;z-index:40;pointer-events:none}
#sheet-root.open{pointer-events:auto}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.55);opacity:0;transition:opacity .25s}
#sheet-root.open .scrim{opacity:1}
.sheet{position:absolute;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;max-height:92dvh;overflow:auto;background:var(--s1);border-radius:26px 26px 0 0;border:1px solid var(--line);border-bottom:0;padding:10px 18px calc(var(--sb) + 20px);transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.9,.25,1)}
#sheet-root.open .sheet{transform:none}
.grab{width:40px;height:5px;border-radius:5px;background:var(--s3);margin:0 auto 16px}
.sheet h2{font-size:21px;margin-bottom:18px}

/* Modal */
#modal-root{position:fixed;inset:0;z-index:50;display:none;place-items:center;padding:24px;background:rgba(0,0,0,.7)}
#modal-root.open{display:grid}
.modal{width:100%;max-width:340px;text-align:center;background:var(--s1);border:1px solid var(--line);border-radius:28px;padding:30px 22px 22px;animation:rise .45s cubic-bezier(.2,1.3,.4,1)}
@keyframes rise{from{transform:translateY(30px) scale(.9);opacity:0}}
.modal .kicker{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--ac2);font-weight:700}
.modal .medal{width:110px;height:110px;font-size:52px;margin:20px auto}
.modal h2{font-size:24px}
.modal p{color:var(--mu);margin:8px 0 22px}

#toast{position:fixed;left:50%;bottom:calc(var(--sb) + 92px);transform:translate(-50%,20px);opacity:0;z-index:60;background:var(--tx);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:650;font-size:15px;transition:.3s;pointer-events:none;max-width:calc(100vw - 32px);text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:70}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><linearGradient id="gfire" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff7a1a"/><stop offset="1" stop-color="#ffb03a"/></linearGradient></defs></svg>
<main id="app"></main>
<nav id="nav" hidden><div class="in">
  <button data-a="tab" data-tab="hoy"><svg viewBox="0 0 24 24"><path d="M12 3c1 3.5 5 5.5 5 10a5 5 0 0 1-10 0c0-2 1-3.5 2-4.5.3 1.5 1 2.5 2 3 0-3 0-6 1-8.5Z"/></svg>Hoy</button>
  <button data-a="tab" data-tab="pilares"><svg viewBox="0 0 24 24"><path d="M3 21h18M5 21V9M12 21V9M19 21V9M2 9l10-6 10 6"/></svg>Pilares</button>
  <button data-a="tab" data-tab="logros"><svg viewBox="0 0 24 24"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4ZM7 6H4v1a3 3 0 0 0 3 3M17 6h3v1a3 3 0 0 1-3 3"/></svg>Logros</button>

</div></nav>
<div id="sheet-root"></div>
<div id="modal-root" role="dialog" aria-modal="true"></div>
<div id="toast" role="status" aria-live="polite"></div>
<canvas id="confetti"></canvas>
<input type="file" id="import-file" accept="application/json,.json" hidden>

<script>
(() => {
'use strict';

// ---------- Utilidades ----------
const KEY = 'progreso:v1';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const pad = n => String(n).padStart(2, '0');
const dkey = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const todayKey = () => dkey(new Date());
const parseKey = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const fmtDate = k => parseKey(k).toLocaleDateString('es-ES', { day: 'numeric', month: 'short', year: 'numeric' });
const plural = (n, s, p) => `${n} ${n === 1 ? s : p}`;
const firstGrapheme = s => {
  s = String(s || '').trim();
  if (!s) return '';
  if (window.Intl && Intl.Segmenter) return [...new Intl.Segmenter('es', { granularity: 'grapheme' }).segment(s)][0].segment;
  return Array.from(s)[0];
};
const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="#0b0d12" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

const PALETTE = ['#3ddc97', '#6c8cff', '#ffc23d', '#ff7a1a', '#ff5a8a', '#2ec5e6', '#b07cff', '#9be15d'];
const DEFAULT_PILLARS = [
  { name: 'Salud', emoji: '💪', color: '#3ddc97' },
  { name: 'Mente', emoji: '🧠', color: '#6c8cff' },
  { name: 'Finanzas', emoji: '💰', color: '#ffc23d' },
];

const TROPHIES = [
  { d: 3,    n: 'Chispa',              e: '✨', t: 'bronze' },
  { d: 7,    n: 'Semana en llamas',    e: '🔥', t: 'bronze' },
  { d: 14,   n: 'Dos semanas firmes',  e: '💪', t: 'bronze' },
  { d: 30,   n: 'Mes imparable',       e: '🌙', t: 'silver' },
  { d: 50,   n: 'Medio centenar',      e: '⚡', t: 'silver' },
  { d: 90,   n: 'Trimestre de hierro', e: '🛡️', t: 'gold' },
  { d: 150,  n: 'Despegue',            e: '🚀', t: 'gold' },
  { d: 250,  n: 'Élite',               e: '👑', t: 'platinum' },
  { d: 365,  n: 'Vuelta al sol',       e: '🌍', t: 'platinum' },
  { d: 500,  n: 'Titán',               e: '🐉', t: 'diamond' },
  { d: 1000, n: 'Inmortal',            e: '💎', t: 'diamond' },
];

const LOGROS = [
  { id: 'first_day',  e: '👣', n: 'Primer paso',    d: 'Completa todas tus tareas de un día.', ok: () => totalDays() >= 1 },
  { id: 'first_goal', e: '🎯', n: 'Visionario',     d: 'Crea tu primer objetivo a largo plazo.', ok: () => state.goals.length >= 1 },
  { id: 'balance',    e: '⚖️', n: 'Equilibrio',     d: 'Completa un día con tareas de los 3 pilares.',
    ok: () => isComplete(todayKey()) && state.pillars.every(p => state.tasks.some(t => t.pillarId === p.id)) },
  { id: 'goal_done',  e: '🏁', n: 'Meta alcanzada', d: 'Completa un objetivo a largo plazo.', ok: () => goalsDone() >= 1 },
  { id: 'days25',     e: '📆', n: 'Constancia',     d: 'Suma 25 días completos.', ok: () => totalDays() >= 25 },
  { id: 'goals5',     e: '🗂️', n: 'Coleccionista',  d: 'Completa 5 objetivos a largo plazo.', ok: () => goalsDone() >= 5 },
  { id: 'days100',    e: '🏛️', n: 'Centurión',      d: 'Suma 100 días completos.', ok: () => totalDays() >= 100 },
];

// ---------- Estado ----------
function defaultState() {
  return {
    version: 1, onboarded: false,
    pillars: DEFAULT_PILLARS.map(p => ({ ...p, id: uid() })),
    goals: [], tasks: [], history: {}, bestStreak: 0, unlocked: {},
    createdAt: todayKey(),
  };
}
const valid = s => s && Array.isArray(s.pillars) && s.pillars.length === 3 && Array.isArray(s.tasks) && Array.isArray(s.goals) && s.history && typeof s.history === 'object';

// Sanea datos cargados o importados: solo se aceptan valores con formato conocido
const DATE_RE = /^\d{4}-\d{2}-\d{2}$/;
const cleanId = v => String(v ?? '').replace(/[^a-z0-9]/gi, '').slice(0, 32) || uid();
const cleanStr = (v, max) => String(v ?? '').slice(0, max);
const cleanDate = v => (typeof v === 'string' && DATE_RE.test(v) ? v : '');
const cleanColor = v => (typeof v === 'string' && /^#[0-9a-f]{6}$/i.test(v) ? v : PALETTE[0]);
function sanitize(s) {
  const out = defaultState();
  out.onboarded = !!s.onboarded;
  out.createdAt = cleanDate(s.createdAt) || todayKey();
  out.pillars = s.pillars.map((p, i) => ({
    id: cleanId(p && p.id),
    name: cleanStr(p && p.name, 24) || DEFAULT_PILLARS[i].name,
    emoji: firstGrapheme(p && p.emoji) || DEFAULT_PILLARS[i].emoji,
    color: cleanColor(p && p.color),
  }));
  const pids = new Set(out.pillars.map(p => p.id));
  const pid = v => (pids.has(v) ? v : out.pillars[0].id);
  out.tasks = s.tasks.filter(t => t && typeof t === 'object').map(t => ({
    id: cleanId(t.id), title: cleanStr(t.title, 80), pillarId: pid(t.pillarId), createdAt: cleanDate(t.createdAt),
  }));
  out.goals = s.goals.filter(g => g && typeof g === 'object').map(g => {
    const progress = Math.max(0, Math.min(100, Math.round(Number(g.progress)) || 0));
    return {
      id: cleanId(g.id), title: cleanStr(g.title, 100), pillarId: pid(g.pillarId),
      deadline: cleanDate(g.deadline), progress, done: progress >= 100,
      doneAt: cleanDate(g.doneAt) || null, createdAt: cleanDate(g.createdAt),
    };
  });
  for (const [k, h] of Object.entries(s.history)) {
    if (!DATE_RE.test(k) || !h || typeof h !== 'object') continue;
    out.history[k] = {
      done: Array.isArray(h.done) ? h.done.map(cleanId) : [],
      total: Math.max(0, Number(h.total) || 0),
      complete: !!h.complete,
    };
  }
  out.bestStreak = Math.max(0, Math.floor(Number(s.bestStreak)) || 0);
  if (s.unlocked && typeof s.unlocked === 'object') {
    const ids = new Set([...TROPHIES.map(t => 't' + t.d), ...LOGROS.map(l => l.id)]);
    for (const [k, v] of Object.entries(s.unlocked)) if (ids.has(k) && DATE_RE.test(v)) out.unlocked[k] = v;
  }
  return out;
}

function load() {
  try {
    const s = JSON.parse(localStorage.getItem(KEY));
    if (valid(s)) return sanitize(s);
  } catch (e) {}
  return defaultState();
}
let state = load();
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); }
  catch (e) { toast('No se pudo guardar en este dispositivo'); }
}
let tab = (() => { try { return localStorage.getItem('progreso:tab') || 'hoy'; } catch (e) { return 'hoy'; } })();

const pillar = id => state.pillars.find(p => p.id === id) || state.pillars[0];
const isComplete = k => !!(state.history[k] && state.history[k].complete);
const totalDays = () => Object.values(state.history).filter(h => h.complete).length;
const goalsDone = () => state.goals.filter(g => g.done).length;

function currentStreak() {
  let d = new Date();
  if (!isComplete(dkey(d))) d = addDays(d, -1);
  let s = 0;
  while (isComplete(dkey(d))) { s++; d = addDays(d, -1); }
  return s;
}

// Recalcula si hoy está completo según las tareas actuales
function recomputeToday() {
  const h = state.history[todayKey()];
  if (!h) return;
  const ids = new Set(state.tasks.map(t => t.id));
  h.done = h.done.filter(id => ids.has(id));
  h.total = state.tasks.length;
  h.complete = h.total > 0 && h.done.length === h.total;
}

function toggleTask(id) {
  const k = todayKey();
  const h = state.history[k] || (state.history[k] = { done: [], total: 0, complete: false });
  const was = h.complete;
  const i = h.done.indexOf(id);
  if (i >= 0) h.done.splice(i, 1); else { h.done.push(id); navigator.vibrate && navigator.vibrate(12); }
  recomputeToday();
  save();
  render();
  const el = document.querySelector(`.task[data-id="${id}"]`);
  if (el && i < 0) el.classList.add('just');
  if (!was && h.complete) {
    const s = currentStreak();
    toast(`🔥 ¡Día completado! Racha: ${plural(s, 'día', 'días')}`);
    confetti();
    navigator.vibrate && navigator.vibrate([20, 60, 30]);
  }
  checkUnlocks();
}

// ---------- Desbloqueos ----------
const queue = [];
let showing = false;
function checkUnlocks() {
  const s = currentStreak();
  if (s > state.bestStreak) state.bestStreak = s;
  const fresh = [];
  for (const t of TROPHIES) {
    const id = 't' + t.d;
    if (state.bestStreak >= t.d && !state.unlocked[id]) { state.unlocked[id] = todayKey(); fresh.push({ kind: 'trofeo', ...t }); }
  }
  for (const l of LOGROS) {
    if (!state.unlocked[l.id] && l.ok()) { state.unlocked[l.id] = todayKey(); fresh.push({ kind: 'logro', ...l }); }
  }
  save();
  if (fresh.length) {
    queue.push(...fresh);
    if (!showing) setTimeout(nextCelebration, 500);
  }
}
function nextCelebration() {
  const m = $('#modal-root');
  const it = queue.shift();
  if (!it) { showing = false; m.classList.remove('open'); m.innerHTML = ''; render(); return; }
  showing = true;
  const trophy = it.kind === 'trofeo';
  m.innerHTML = `<div class="modal">
    <div class="kicker">${trophy ? '¡Trofeo desbloqueado!' : '¡Logro desbloqueado!'}</div>
    <div class="medal ${trophy ? 'tier-' + it.t : 'tier-gold'}">${it.e}</div>
    <h2>${esc(it.n)}</h2>
    <p>${trophy ? `${it.d} días seguidos cumpliendo todas tus tareas.` : esc(it.d)}</p>
    <button class="btn primary block" data-a="celebrate-next">${queue.length ? 'Siguiente' : '¡Vamos!'}</button>
  </div>`;
  m.classList.add('open');
  confetti();
}

function pillarEditor(p, i) {

  </div>`;

function viewToday() {
  const k = todayKey();
  const h = state.history[k] || { done: [] };
  const total = state.tasks.length;
  const done = state.tasks.filter(t => h.done.includes(t.id)).length;
  const complete = isComplete(k);
  const streak = currentStreak();
  const best = Math.max(state.bestStreak, streak);
  const next = TROPHIES.find(t => t.d > streak);
  const prev = [...TROPHIES].reverse().find(t => t.d <= streak);
  const base = prev ? prev.d : 0;
  const C = 2 * Math.PI * 38;
  const off = C * (1 - (total ? done / total : 0));
  const dateRaw = new Date().toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long' });
  const dateTxt = dateRaw.charAt(0).toUpperCase() + dateRaw.slice(1);

  let hint;
  if (!total) hint = '';
  else if (complete) hint = `<div class="hint win">✅ Día completado. Vuelve mañana para sumar otro punto de racha.</div>`;
  else if (streak > 0) hint = `<div class="hint">Te faltan ${plural(total - done, 'tarea', 'tareas')} para mantener tu racha de ${plural(streak, 'día', 'días')}.</div>`;
  else hint = `<div class="hint">Completa todas tus tareas de hoy para empezar una racha.</div>`;

  const groups = state.pillars.map(p => {
    const ts = state.tasks.filter(t => t.pillarId === p.id);
    if (!ts.length) return '';
    const dn = ts.filter(t => h.done.includes(t.id)).length;
    return `<div class="group">
      <div class="ghead" style="--c:${p.color}"><span class="dot"></span>${esc(p.emoji)} ${esc(p.name)}<small>${dn}/${ts.length}</small></div>
      ${ts.map(t => { const ok = h.done.includes(t.id); return `<button class="task ${ok ? 'done' : ''}" data-a="toggle" data-id="${t.id}" style="--c:${p.color}" aria-pressed="${ok}"><span class="check">${CHECK}</span><span class="tt">${esc(t.title)}</span></button>`; }).join('')}
    </div>`;
  }).join('');

  return `<header class="top"><div><div class="eyebrow">${dateTxt}</div><h1>Hoy</h1></div></header>
  <section class="card hero">
    <div class="ring" aria-label="${done} de ${total} tareas">
      <svg width="92" height="92" viewBox="0 0 92 92"><circle class="bgc" cx="46" cy="46" r="38"/><circle class="fgc" cx="46" cy="46" r="38" stroke-dasharray="${C}" stroke-dashoffset="${off}"/></svg>
      <div class="lbl"><div><b>${done}/${total}</b><small>tareas</small></div></div>
    </div>
    <div>
      <div class="streak-n"><span class="flame ${streak ? '' : 'off'}">🔥</span><b>${streak}</b><span>${streak === 1 ? 'día' : 'días'} de racha</span></div>
      <div class="best">Mejor racha: ${plural(best, 'día', 'días')}</div>
    </div>
    ${next ? `<div class="next" style="grid-column:1/-1">Próximo trofeo: ${next.e} <b style="color:var(--tx)">${esc(next.n)}</b> · faltan ${plural(next.d - streak, 'día', 'días')}<div class="bar"><i style="width:${Math.round((streak - base) / (next.d - base) * 100)}%"></i></div></div>` : `<div class="next" style="grid-column:1/-1">Has conseguido todos los trofeos. Leyenda. 💎</div>`}
  </section>
  ${hint}
  ${weekStrip()}
  <div class="sec-h"><h2>Tareas diarias</h2>${total ? `<button class="link" data-a="add-task">+ Añadir</button>` : ''}</div>
  ${total ? groups : `<div class="empty"><div class="big">📝</div><p>Aún no tienes tareas diarias.<br>Añade las que quieres cumplir cada día.</p><button class="btn primary" data-a="add-task">Añadir tarea</button></div>`}`;
}

function weekStrip() {
  const L = ['D', 'L', 'M', 'X', 'J', 'V', 'S'];
  const t = new Date();
  let out = '';
  for (let i = 6; i >= 0; i--) {
    const d = addDays(t, -i), k = dkey(d), h = state.history[k];
    const cls = h && h.complete ? 'full' : (h && h.done.length ? 'part' : '');
    out += `<div class="wd ${cls} ${i === 0 ? 'today' : ''}">${L[d.getDay()]}<i>${h && h.complete ? '🔥' : d.getDate()}</i></div>`;
  }
  return `<div class="week">${out}</div>`;
}

function viewPillars() {
  return `<header class="top"><div><div class="eyebrow">Tu sistema</div><h1>Pilares</h1></div></header>
  ${state.pillars.map(p => {
    const goals = state.goals.filter(g => g.pillarId === p.id).sort((a, b) => a.done - b.done);
    const tasks = state.tasks.filter(t => t.pillarId === p.id);
    return `<section class="pcard" style="--c:${p.color}">
      <header><span class="pe">${esc(p.emoji)}</span><div><h2>${esc(p.name)}</h2><small>${plural(goals.length, 'objetivo', 'objetivos')} · ${plural(tasks.length, 'tarea diaria', 'tareas diarias')}</small></div></header>
      <div class="pbody">
        <div class="sub"><h3>Objetivos a largo plazo</h3><button data-a="add-goal" data-p="${p.id}">+ Añadir</button></div>
        ${goals.length ? goals.map(goalItem).join('') : '<div class="none">Sin objetivos todavía.</div>'}
        <div class="sub"><h3>Tareas diarias</h3><button data-a="add-task" data-p="${p.id}">+ Añadir</button></div>
        ${tasks.length ? tasks.map(t => `<button class="item" data-a="edit-task" data-id="${t.id}"><div class="row"><span class="tdot"></span><b>${esc(t.title)}</b><span class="pct">Editar</span></div></button>`).join('') : '<div class="none">Sin tareas diarias todavía.</div>'}
      </div>
    </section>`;
  }).join('')}`;
}

function goalItem(g) {
  let meta = '';
  if (g.done) meta = `Completado el ${fmtDate(g.doneAt || todayKey())}`;
  else if (g.deadline) {
    const days = Math.round((parseKey(g.deadline) - parseKey(todayKey())) / 864e5);
    meta = days > 0 ? `Fecha objetivo: ${fmtDate(g.deadline)} · faltan ${plural(days, 'día', 'días')}` : days === 0 ? 'Fecha objetivo: hoy' : `Fecha objetivo superada (${fmtDate(g.deadline)})`;
  }
  return `<button class="item ${g.done ? 'done' : ''}" data-a="edit-goal" data-id="${g.id}">
    <div class="row"><b>${g.done ? '✓ ' : ''}${esc(g.title)}</b><span class="pct">${g.progress}%</span></div>
    <div class="bar"><i style="width:${g.progress}%"></i></div>
    ${meta ? `<div class="meta">${meta}</div>` : ''}
  </button>`;
}

function viewAchievements() {
  const streak = currentStreak();
  const best = Math.max(state.bestStreak, streak);
  const got = TROPHIES.filter(t => state.unlocked['t' + t.d]).length + LOGROS.filter(l => state.unlocked[l.id]).length;
  return `<header class="top"><div><div class="eyebrow">${got} de ${TROPHIES.length + LOGROS.length} desbloqueados</div><h1>Logros</h1></div></header>
  <div class="stats">
    <div class="stat"><b>${streak}</b><span>Racha actual</span></div>
    <div class="stat"><b>${best}</b><span>Mejor racha</span></div>
    <div class="stat"><b>${totalDays()}</b><span>Días completos</span></div>
  </div>
  <div class="sec-h"><h2>Últimas 18 semanas</h2></div>
  <div class="card">${heatmap()}<div class="legend"><span><i style="background:linear-gradient(135deg,#ff7a1a,#ffb03a)"></i>Completo</span><span><i style="background:rgba(255,122,26,.3)"></i>Parcial</span><span><i style="background:var(--s2)"></i>Sin completar</span></div></div>
  <div class="sec-h"><h2>Trofeos de racha</h2></div>
  <div class="trophies">${TROPHIES.map(t => {
    const u = state.unlocked['t' + t.d];
    return `<div class="trophy ${u ? '' : 'lock'} tier-${t.t}"><div class="medal">${t.e}</div><b>${esc(t.n)}</b><small>${u ? `${t.d} días · ${fmtDate(u)}` : `${t.d} días · faltan ${t.d - streak}`}</small></div>`;
  }).join('')}</div>
  <div class="sec-h"><h2>Logros</h2></div>
  ${LOGROS.map(l => {
    const u = state.unlocked[l.id];
    return `<div class="logro ${u ? '' : 'lock'}"><span class="le">${l.e}</span><div><b>${esc(l.n)}</b><small>${esc(l.d)}</small></div>${u ? `<span class="when">${fmtDate(u)}</span>` : ''}</div>`;
  }).join('')}`;
}

function heatmap() {
  const WEEKS = 18;
  const t = new Date();
  const dow = (t.getDay() + 6) % 7; // lunes = 0
  const start = addDays(t, -dow - (WEEKS - 1) * 7);
  const tk = todayKey();
  let out = '';
  for (let i = 0; i < WEEKS * 7; i++) {
    const d = addDays(start, i), k = dkey(d), h = state.history[k];
    let c = '';
    if (d > t && k !== tk) c = 'x';
    else if (h && h.complete) c = 'f';
    else if (h && h.done.length) c = 'p';
    out += `<i class="${c} ${k === tk ? 't' : ''}" title="${k}"></i>`;
  }
  return `<div class="heat" style="grid-template-columns:repeat(${WEEKS},1fr)">${out}</div>`;
}

function viewSettings() {
  return `<header class="top"><div><div class="eyebrow">Personaliza</div><h1>Ajustes</h1></div></header>
  <form id="pillars-form">
    <div class="sec-h" style="margin-top:6px"><h2>Tus 3 pilares</h2></div>
    ${state.pillars.map(pillarEditor).join('')}
    <button class="btn soft block">Guardar pilares</button>
  </form>
  <div class="sec-h"><h2>Tus datos</h2></div>
  <button class="setting" data-a="export"><span class="ic">⬇️</span><div><b>Exportar copia de seguridad</b><small>Descarga un archivo con todo tu progreso</small></div></button>
  <button class="setting" data-a="import"><span class="ic">⬆️</span><div><b>Importar copia de seguridad</b><small>Restaura desde un archivo exportado</small></div></button>
  <button class="setting danger" data-a="reset"><span class="ic">🗑️</span><div><b>Borrar todo</b><small>Empieza de cero</small></div></button>
  <p class="note">Tus datos se guardan solo en este dispositivo. Exporta una copia de vez en cuando para no perder tu racha.</p>`;

function render() {
  const app = $('#app'), nav = $('#nav');
  if (!state.onboarded) { app.innerHTML = viewOnboarding(); nav.hidden = true; return; }
  nav.hidden = false;
  const views = { hoy: viewToday, pilares: viewPillars, logros: viewAchievements, ajustes: viewSettings };
  if (!views[tab]) tab = 'hoy';
  app.innerHTML = views[tab]();
  nav.querySelectorAll('button').forEach(b => { const on = b.dataset.tab === tab; b.classList.toggle('on', on); b.setAttribute('aria-current', on ? 'page' : 'false'); });
}

// ---------- Hojas (formularios) ----------
function openSheet(title, body, { onSubmit, onMount } = {}) {
  const root = $('#sheet-root');
  root.innerHTML = `<div class="scrim" data-a="close-sheet"></div><form class="sheet" id="sheet-form" autocomplete="off"><div class="grab"></div><h2>${title}</h2>${body}</form>`;
  const f = $('#sheet-form');
  f.addEventListener('submit', e => { e.preventDefault(); if (onSubmit(new FormData(f)) !== false) closeSheet(); });
  onMount && onMount(f);
  requestAnimationFrame(() => requestAnimationFrame(() => root.classList.add('open')));
}
function closeSheet() {
  const root = $('#sheet-root');
  root.classList.remove('open');
  setTimeout(() => { if (!root.classList.contains('open')) root.innerHTML = ''; }, 320);
}

function pillarPicker(pid) {
  return `<div class="fld"><span>Pilar</span><div class="chips">${state.pillars.map(p => `<label class="chip" style="--c:${p.color}"><input type="radio" name="pillar" value="${p.id}" ${p.id === pid ? 'checked' : ''}><span>${esc(p.emoji)} ${esc(p.name)}</span></label>`).join('')}</div></div>`;
}

function taskSheet(task, pillarId) {
  const isNew = !task;
  const pid = task ? task.pillarId : (pillarId || state.pillars[0].id);
  openSheet(isNew ? 'Nueva tarea diaria' : 'Editar tarea', `
    <label class="fld"><span>Tarea</span><input type="text" name="title" required maxlength="80" placeholder="Ej: 30 min de ejercicio" value="${esc(task ? task.title : '')}"></label>
    ${pillarPicker(pid)}
    <div class="row-btns">${isNew ? '<button type="button" class="btn ghost" data-a="close-sheet">Cancelar</button>' : '<button type="button" class="btn ghost danger" data-del>Eliminar</button>'}<button class="btn primary">${isNew ? 'Añadir' : 'Guardar'}</button></div>`, {
    onSubmit: f => {
      const title = String(f.get('title')).trim();
      if (!title) return false;
      const pillarId = f.get('pillar') || pid;
      if (isNew) state.tasks.push({ id: uid(), title, pillarId, createdAt: todayKey() });
      else Object.assign(task, { title, pillarId });
      recomputeToday(); save(); render(); checkUnlocks();
      toast(isNew ? 'Tarea añadida' : 'Tarea guardada');
    },
    onMount: form => {
      const del = form.querySelector('[data-del]');
      if (del) del.addEventListener('click', () => {
        if (!confirm(`¿Eliminar la tarea "${task.title}"?`)) return;
        state.tasks = state.tasks.filter(t => t !== task);
        recomputeToday(); save(); closeSheet(); render(); checkUnlocks();
      });
      if (isNew) setTimeout(() => form.title.focus(), 330);
    },
  });
}

function goalSheet(goal, pillarId) {
  const isNew = !goal;
  const g = goal || { title: '', pillarId: pillarId || state.pillars[0].id, deadline: '', progress: 0 };
  openSheet(isNew ? 'Nuevo objetivo' : 'Editar objetivo', `
    <label class="fld"><span>Objetivo a largo plazo</span><input type="text" name="title" required maxlength="100" placeholder="Ej: Correr una maratón" value="${esc(g.title)}"></label>
    ${pillarPicker(g.pillarId)}
    <label class="fld"><span>Fecha objetivo (opcional)</span><input type="date" name="deadline" value="${esc(g.deadline || '')}"></label>
    <label class="fld"><div class="range-h"><span style="font-size:13px;color:var(--mu);font-weight:550">Progreso</span><output>${g.progress}%</output></div><input type="range" name="progress" min="0" max="100" step="5" value="${g.progress}"></label>
    <div class="row-btns">${isNew ? '<button type="button" class="btn ghost" data-a="close-sheet">Cancelar</button>' : '<button type="button" class="btn ghost danger" data-del>Eliminar</button>'}<button class="btn primary">${isNew ? 'Crear' : 'Guardar'}</button></div>`, {
    onSubmit: f => {
      const title = String(f.get('title')).trim();
      if (!title) return false;
      const progress = Math.max(0, Math.min(100, Number(f.get('progress')) || 0));
      const done = progress >= 100;
      const data = { title, pillarId: f.get('pillar') || g.pillarId, deadline: f.get('deadline') || '', progress, done };
      if (done && !g.done) data.doneAt = todayKey();
      if (!done) data.doneAt = null;
      if (isNew) state.goals.push({ id: uid(), createdAt: todayKey(), ...data });
      else Object.assign(goal, data);
      save(); render(); checkUnlocks();
      toast(done && !g.done ? '🏁 ¡Objetivo cumplido!' : (isNew ? 'Objetivo creado' : 'Objetivo guardado'));
      if (done && !g.done) confetti();
    },
    onMount: form => {
      const r = form.progress, o = form.querySelector('output');
      r.addEventListener('input', () => { o.textContent = r.value + '%'; });
      const del = form.querySelector('[data-del]');
      if (del) del.addEventListener('click', () => {
        if (!confirm(`¿Eliminar el objetivo "${goal.title}"?`)) return;
        state.goals = state.goals.filter(x => x !== goal);
        save(); closeSheet(); render();
      });
      if (isNew) setTimeout(() => form.title.focus(), 330);
    },
  });
}

// ---------- Datos ----------
function exportData() {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `progreso-${todayKey()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
$('#import-file').addEventListener('change', async e => {
  const file = e.target.files[0];
  e.target.value = '';
  if (!file) return;
  try {
    const s = JSON.parse(await file.text());
    if (!valid(s)) throw new Error('formato');
    if (!confirm('Esto reemplazará tus datos actuales por los de la copia. ¿Continuar?')) return;
    state = sanitize(s);
    state.onboarded = true;
    save(); render(); toast('Copia restaurada');
  } catch (err) { toast('Archivo no válido'); }
});

// ---------- Efectos ----------
let toastT;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2600);
}

function confetti() {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const c = $('#confetti'), x = c.getContext('2d'), r = window.devicePixelRatio || 1;
  const W = c.width = innerWidth * r, H = c.height = innerHeight * r;
  const cols = ['#ff7a1a', '#ffb03a', '#3ddc97', '#6c8cff', '#ffc83d', '#ff5a8a', '#ffffff'];
  const ps = Array.from({ length: 150 }, () => ({
    x: W / 2 + (Math.random() - .5) * W * .2, y: H * .38,
    vx: (Math.random() - .5) * 18 * r, vy: (-Math.random() * 16 - 6) * r,
    w: (6 + Math.random() * 6) * r, h: (3 + Math.random() * 4) * r,
    a: Math.random() * 6, va: (Math.random() - .5) * .4, c: cols[(Math.random() * cols.length) | 0],
  }));
  const t0 = performance.now();
  (function f(now) {
    const el = now - t0;
    x.clearRect(0, 0, W, H);
    for (const p of ps) {
      p.vy += .45 * r; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.a += p.va;
      x.save(); x.translate(p.x, p.y); x.rotate(p.a);
      x.globalAlpha = Math.max(0, 1 - el / 2600);
      x.fillStyle = p.c; x.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); x.restore();
    }
    if (el < 2600) requestAnimationFrame(f); else x.clearRect(0, 0, W, H);
  })(t0);
}

// ---------- Eventos ----------
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]');
  if (!el) return;
  const a = el.dataset.a;
  if (a === 'tab') {
    tab = el.dataset.tab;
    try { localStorage.setItem('progreso:tab', tab); } catch (err) {}
    render(); window.scrollTo(0, 0);
  }
  else if (a === 'toggle') toggleTask(el.dataset.id);
  else if (a === 'add-task') taskSheet(null, el.dataset.p);
  else if (a === 'edit-task') { const t = state.tasks.find(x => x.id === el.dataset.id); if (t) taskSheet(t); }
  else if (a === 'add-goal') goalSheet(null, el.dataset.p);
  else if (a === 'edit-goal') { const g = state.goals.find(x => x.id === el.dataset.id); if (g) goalSheet(g); }
  else if (a === 'close-sheet') closeSheet();
  else if (a === 'celebrate-next') nextCelebration();
  else if (a === 'export') exportData();
  else if (a === 'import') $('#import-file').click();
  else if (a === 'reset') {
    if (!confirm('¿Borrar TODO tu progreso? Esta acción no se puede deshacer.')) return;
    if (!confirm('¿Seguro? Perderás tu racha, objetivos y trofeos.')) return;
    state = defaultState(); save(); tab = 'hoy'; render();
  }
});

document.addEventListener('change', e => {
  if (e.target.matches('.sw input')) e.target.closest('.pedit').style.setProperty('--c', e.target.value);
});

document.addEventListener('submit', e => {
  if (e.target.id !== 'pillars-form') return;
  e.preventDefault();
  const f = new FormData(e.target);
  state.pillars = state.pillars.map((p, i) => ({
    ...p,
    emoji: firstGrapheme(f.get('e' + i)) || p.emoji,
    name: String(f.get('n' + i) || '').trim() || p.name,
    color: f.get('c' + i) || p.color,
  }));
  const first = !state.onboarded;
  state.onboarded = true;
  save(); render();
  toast(first ? '¡Listo! Añade tus tareas diarias' : 'Pilares guardados');
});

document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#sheet-root').classList.contains('open')) closeSheet(); });

// Cambio de día (medianoche o al volver a la app)
let lastDay = todayKey();
function dayCheck() { if (todayKey() !== lastDay) { lastDay = todayKey(); render(); } }
setInterval(dayCheck, 30000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) dayCheck(); });

// ---------- Arranque ----------
render();
if (state.onboarded) checkUnlocks();
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
})();
</script>
</body>
</html>
